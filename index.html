<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#260708">

<title>Lafite 羽喬｜Wedding & Event Host</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#100606;
  color:#f7efe6;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
}

.wrap{
  max-width:680px;
  margin:auto;
  min-height:100vh;
  background:linear-gradient(#310b0d,#120606);
}

.hero{
  width:100%;
  display:block;
}

.content{
  padding:30px 24px 42px;
}

.eyebrow{
  letter-spacing:.18em;
  color:#d9bd8f;
  font-size:13px;
}

.name{
  font-family:Georgia,serif;
  font-size:38px;
  margin:7px 0 2px;
}

.role{
  font-size:17px;
  color:#eadfd7;
  margin-bottom:22px;
}

.lead{
  font-size:18px;
  line-height:1.75;
  margin:0 0 28px;
}

.lead b{
  color:#e1c08f;
}

.card{
  border:1px solid #765250;
  background:rgba(255,255,255,.035);
  border-radius:18px;
  padding:20px;
  margin:15px 0;
}

.card h2{
  font-size:21px;
  margin:0 0 5px;
}

.en{
  font-family:Georgia,serif;
  color:#d9bd8f;
  font-size:14px;
}

.desc{
  line-height:1.7;
  color:#eadfd7;
  margin:12px 0 0;
}

.buttons{
  display:grid;
  gap:12px;
  margin-top:28px;
}

.btn{
  border:none;
  width:100%;
  text-decoration:none;
  text-align:center;
  padding:16px;
  border-radius:999px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  display:block;
}

.share{
  background:#d5b57e;
  color:#260708;
}

.line{
  background:#06c755;
  color:white;
}

.fb{
  background:transparent;
  border:1px solid #c6a875;
  color:#f5e5c8;
}

.foot{
  text-align:center;
  color:#a98d84;
  font-size:12px;
  margin-top:30px;
  letter-spacing:.08em;
}
</style>
</head>

<body>

<main class="wrap">

<img class="hero" src="lafite.jpg" alt="Lafite 羽喬">

<section class="content">

<div class="eyebrow">WEDDING & EVENT HOST</div>

<h1 class="name">Lafite 羽喬</h1>

<div class="role">活動／婚禮主持人</div>

<p class="lead">
<b>千場婚禮 × 活動主持經驗</b><br>
讓每一場重要時刻，<br>
都被好好說進故事裡。
</p>

<div class="card">
<h2>喬藝有囍</h2>
<div class="en">JNLove Wedding</div>
<p class="desc">
一站式婚宴整合服務<br>
婚禮顧問・婚宴企劃・禮俗諮詢
</p>
</div>

<div class="card">
<h2>喬藝樂薈</h2>
<div class="en">JNLove Event</div>
<p class="desc">
全方位活動解決方案<br>
活動策劃・整合統籌・商業設計
</p>
</div>

<div class="buttons">

<button class="btn share" type="button" onclick="shareCard()">
分享我的電子名片
</button>

<a class="btn line" href="https://lin.ee/pPhhB6E">
LINE 聯絡我
</a>

<a class="btn fb"
href="https://www.facebook.com/share/1C5XHTRY73/?mibextid=wwXIfr">
Facebook
</a>

</div>

<div class="foot">
JNLOVE · EVERY MOMENT DESERVES TO BE REMEMBERED.
</div>

</section>
</main>

<script>

const LIFF_ID = "2011754552-snXk04s7";
const LIFF_URL = "https://liff.line.me/2011754552-snXk04s7";
const HERO_IMAGE = "https://lafite-jnlove.github.io/business-card/lafite.jpg";

async function initLiff(){
  try{
    await liff.init({liffId: LIFF_ID});
  }catch(err){
    console.error("LIFF init error", err);
  }
}

async function shareCard(){

  try{

    if(!liff.isLoggedIn()){
      liff.login();
      return;
    }

    if(!liff.isApiAvailable("shareTargetPicker")){
      alert("請從 LINE 開啟電子名片後再分享。");
      return;
    }

    await liff.shareTargetPicker([
      {
        type:"flex",
        altText:"Lafite 羽喬｜活動・婚禮主持人電子名片",

        contents:{
          type:"bubble",

          hero:{
            type:"image",
            url:HERO_IMAGE,
            size:"full",
            aspectRatio:"3:4",
            aspectMode:"cover",
            action:{
              type:"uri",
              uri:LIFF_URL
            }
          },

          body:{
            type:"box",
            layout:"vertical",
            spacing:"md",

            contents:[
              {
                type:"text",
                text:"Lafite 羽喬",
                weight:"bold",
                size:"xl",
                color:"#321011"
              },
              {
                type:"text",
                text:"Wedding & Event Host",
                size:"sm",
                color:"#9A7041"
              },
              {
                type:"text",
                text:"活動／婚禮主持人",
                size:"sm",
                color:"#765250",
                margin:"sm"
              },
              {
                type:"separator",
                margin:"md"
              },
              {
                type:"text",
                text:"千場婚禮 × 活動主持經驗",
                weight:"bold",
                size:"md",
                color:"#9A7041",
                margin:"md",
                wrap:true
              },
              {
                type:"text",
                text:"讓每一場重要時刻，都被好好說進故事裡。",
                size:"sm",
                color:"#555555",
                wrap:true,
                margin:"sm"
              }
            ]
          },

          footer:{
            type:"box",
            layout:"vertical",
            spacing:"sm",

            contents:[
              {
                type:"button",
                style:"primary",
                color:"#321011",
                action:{
                  type:"uri",
                  label:"查看電子名片",
                  uri:LIFF_URL
                }
              },
              {
                type:"button",
                style:"link",
                action:{
                  type:"uri",
                  label:"LINE 聯絡 Lafite",
                  uri:"https://lin.ee/pPhhB6E"
                }
              },
              {
                type:"text",
                text:"JNLOVE · EVERY MOMENT DESERVES TO BE REMEMBERED.",
                size:"xxs",
                color:"#A98D84",
                align:"center",
                wrap:true,
                margin:"md"
              }
            ]
          }
        }
      }
    ],{
      isMultiple:true
    });

  }catch(err){
    console.error("分享失敗",err);
    alert("分享沒有成功，請重新從 LINE 開啟電子名片再試一次。");
  }
}

initLiff();

</script>

</body>
</html>
